name: typed-synthesis-rediscovery

on:
  push:
    branches: [main]
    paths:
      - 'src/arc123/typed_program_synthesis.py'
      - 'src/arc123/controller.py'
      - 'research/packets/P0008_TYPED_SYNTHESIS_REDISCOVERY_2.json'
      - '.github/workflows/typed-synthesis-rediscovery.yml'
  workflow_dispatch:

jobs:
  rediscover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout learner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install learner
        run: python -m pip install -e .

      - name: Clone pinned ARC-AGI-1 source
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/arc1
          git -C /tmp/arc1 checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
          test "$(git -C /tmp/arc1 rev-parse HEAD)" = "399030444e0ab0cc8b4e199870fb20b863846f34"

      - name: Clone pinned ARC-AGI-2 source required by shared runner
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/arc2
          git -C /tmp/arc2 checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(git -C /tmp/arc2 rev-parse HEAD)" = "f3283f727488ad98fe575ea6a5ac981e4a188e49"

      - name: Run synthesis-only rediscovery packet
        run: |
          python scripts/run_arc12_declared_sources.py --run \
            --arc1-source /tmp/arc1 \
            --arc2-source /tmp/arc2 \
            --packet research/packets/P0008_TYPED_SYNTHESIS_REDISCOVERY_2.json \
            --report-root reports/P0008_typed_synthesis_rediscovery_2

      - name: Require two synthesized exact real-task solves
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('reports/P0008_typed_synthesis_rediscovery_2/receipt.json').read_text())
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert receipt['attempt_count'] == 2
          assert receipt['exact_solve_count'] == 2
          assert receipt['controller_oracle_boundary_scan'] == 'pass'
          for attempt in receipt['attempts']:
              assert attempt['all_cells_match'] is True
              assert attempt['training_exact'] is True
              assert attempt['used_fallback'] is False
              assert attempt['selected_hypothesis'].startswith('synth['), attempt
          PY

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P0008-typed-synthesis-rediscovery-2
          path: reports/P0008_typed_synthesis_rediscovery_2
          if-no-files-found: warn
